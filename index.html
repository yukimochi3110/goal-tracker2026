<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>目標チェック</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#38AD6C">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root { --bg: #F4F6F4; --surface: #FFFFFF; --text: #2C3C32; --text-sub: #82A08C; --border: #E4E8E5; --accent: #44B872; --accent-light: #E8F8EE; --g-from: #8ED4A8; --g-to: #38AD6C; --sun: #C84848; --sat: #4070C0; --stop: #C04040; --tb-head-bg: #F1F4F2; --tb-head-tx: #5C6B60; --tb-empty-tx: #A6B0A9; --tb-now-tx: #228A4C; --tb-done-bg: #FFFCF1; --tb-done-bar: #DFAE38; --tb-done-tx: #DFAE38; --tb-stop-bg: #F8F9F8; --tb-stop-bar: #C3CBC5; --tb-stop-ic: #A9B3AB; --shadow: 0 2px 14px rgba(30,80,50,0.07); --radius: 12px; --font: 'Noto Sans JP', sans-serif; }
@media (prefers-color-scheme: dark) { :root { --bg: #131714; --surface: #1E2A20; --text: #D4ECD8; --text-sub: #689A72; --border: #39443B; --accent: #5CD48A; --accent-light: #1A2E1E; --g-from: #4A9060; --g-to: #287048; --sun: #D46868; --sat: #5090D0; --stop: #D46868; --tb-head-bg: #1E2520; --tb-head-tx: #8A998E; --tb-empty-tx: #6E7C71; --tb-now-tx: #8AE3AD; --tb-done-bg: #241F12; --tb-done-bar: #C79A2E; --tb-done-tx: #E0BE55; --tb-stop-bg: #1C201D; --tb-stop-bar: #4A544C; --tb-stop-ic: #6E7C71; --shadow: 0 2px 16px rgba(0,0,0,0.3); } }
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body { font-family: var(--font); background: var(--bg); color: var(--text); font-size: 16px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
#app { max-width: 540px; margin: 0 auto; min-height: 100dvh; display: flex; flex-direction: column; }

/* ── Header ── */
.header { background: linear-gradient(135deg, var(--g-from) 0%, var(--g-to) 100%); padding: 0 16px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; box-shadow: 0 2px 12px rgba(56,173,108,0.3); }
.header-title { font-size: 18px; font-weight: 700; color: #fff; letter-spacing: 0.5px; padding: 14px 0; display: flex; align-items: center; gap: 7px; }
.header-right { display: flex; align-items: center; gap: 8px; }
.settings-btn { background: rgba(255,255,255,0.18); border: none; cursor: pointer; padding: 6px; color: #fff; border-radius: 8px; display: flex; align-items: center; transition: background 0.15s; }
.settings-btn:hover { background: rgba(255,255,255,0.3); }

/* ── Tabs ── */
.tabs { background: var(--surface); border-bottom: 1px solid var(--border); display: flex; }
.tab-btn { flex: 1; border: none; background: none; font-family: var(--font); font-size: 15px; font-weight: 500; color: var(--text-sub); padding: 12px 0; cursor: pointer; position: relative; transition: color 0.2s; }
.tab-btn.active { color: var(--accent); font-weight: 700; }
.tab-btn.active::after { content: ''; position: absolute; bottom: 0; left: 20%; right: 20%; height: 2px; background: var(--accent); border-radius: 2px 2px 0 0; }

/* ── Pages ── */
.page { display: none; flex: 1; padding: 16px; overflow-y: auto; }
.page.active { display: block; }

/* ── Cards ── */
.card { background: var(--surface); border-radius: var(--radius); border: 1px solid var(--border); box-shadow: var(--shadow); overflow: hidden; margin-bottom: 16px; }
.card-header { padding: 12px 16px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
.card-title { font-size: 14px; font-weight: 600; color: var(--text-sub); letter-spacing: 1px; text-transform: uppercase; }

/* ── Achievement Rings ── */
.rings-row { display: flex; gap: 0; overflow-x: auto; padding: 16px; -webkit-overflow-scrolling: touch; }
.rings-row::-webkit-scrollbar { display: none; }
.ring-item { flex: 0 0 auto; display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 0 12px; position: relative; }
.ring-item:not(:last-child) { border-right: 1px solid var(--border); }
.ring-wrapper { position: relative; }
.ring-name { font-size: 13px; color: var(--text-sub); display: flex; align-items: center; gap: 3px; }


/* ── Month nav ── */
.month-nav-row { display: flex; align-items: center; justify-content: space-between; padding: 4px 16px 12px; }
.nav-arrow-btn { background: none; border: 1px solid var(--border); border-radius: 8px; padding: 5px 14px; cursor: pointer; color: var(--text-sub); font-size: 18px; line-height: 1; transition: background 0.15s; }
.nav-arrow-btn:hover { background: var(--bg); }
.month-heading { font-size: 20px; font-weight: 700; color: var(--text); }

/* ── Calendar Table ── */
.table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
.cal-table { width: 100%; border-collapse: collapse; }
.cal-table thead th { background: var(--surface); padding: 8px 6px; font-size: 12px; font-weight: 600; color: var(--text-sub); text-align: center; border-bottom: 2px solid var(--border); border-right: 1px solid var(--border); white-space: nowrap; position: sticky; top: 0; }
.cal-table thead th:first-child { text-align: center; border-right: 2px solid var(--border); width: 1%; white-space: nowrap; }
.cal-table thead th.th-memo { text-align: left; padding-left: 10px; min-width: 130px; border-right: none; }
.cal-table thead th .th-icon { display: flex; flex-direction: column; align-items: center; gap: 2px; }

/* Day rows */
.cal-day-row td { border-bottom: 1px solid var(--border); border-right: 1px solid var(--border); vertical-align: middle; padding: 3px 4px; }
.cal-day-row td:first-child { border-right: 2px solid var(--border); }
.cal-day-row td:last-child { border-right: none; }
.cal-day-row.today td { background: var(--accent-light); }

/* Date cell */
.date-cell { white-space: nowrap; text-align: center; }
.date-num { font-size: 14px; font-weight: 700; line-height: 1.1; }
.date-dow { font-size: 11px; color: var(--text-sub); }
.is-sun .date-num, .is-sun .date-dow { color: var(--sun); }
.is-sat .date-num, .is-sat .date-dow { color: var(--sat); }
.today-circle { display: inline-flex; align-items: center; justify-content: center; width: 24px; height: 24px; background: var(--accent); color: #fff; border-radius: 50%; font-size: 13px; font-weight: 700; }

/* Check button */
.check-cell { text-align: center; }
.check-btn { background: transparent; border: none; width: 100%; height: 32px; padding: 0; text-align: center; font-size: 14px; font-family: var(--font); font-weight: 600; color: var(--text-sub); cursor: pointer; transition: transform 0.1s, color 0.15s; display: block; }
.check-btn:focus { outline: none; }
.check-btn:active { transform: scale(0.85); }

/* Memo cell */
.memo-cell { padding: 4px 8px !important; min-width: 130px; }
.memo-preview-text { font-size: 13px; color: var(--text); cursor: pointer; display: block; line-height: 1.4; transition: color 0.15s; }
.memo-preview-text:hover { color: var(--accent); }
.memo-add-btn { font-size: 13px; color: var(--border); cursor: pointer; }
.memo-add-btn:hover { color: var(--accent); }

/* Memo edit row */
.memo-edit-row { display: none; }
.memo-edit-row.open { display: table-row; }
.memo-edit-row td { padding: 0; border-bottom: 2px solid var(--accent); background: var(--accent-light); }
.memo-edit-inner { padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; }
.memo-goal-tags { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 8px; }
.memo-tag-btn { font-size: 13px; padding: 3px 8px; border-radius: 10px; cursor: pointer; border: none; font-family: var(--font); display: inline-flex; align-items: center; gap: 3px; }
.memo-textarea { width: 100%; border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; font-size: 15px; font-family: var(--font); background: var(--surface); color: var(--text); resize: vertical; min-height: 60px; }
.memo-textarea:focus { outline: none; border-color: var(--accent); }
.memo-actions { display: flex; gap: 8px; justify-content: flex-end; }
.memo-save-btn { background: linear-gradient(135deg, var(--g-from) 0%, var(--g-to) 100%); color: #fff; border: none; border-radius: 50px; padding: 6px 18px; font-size: 13px; font-weight: 600; font-family: var(--font); cursor: pointer; box-shadow: 0 2px 8px rgba(56,173,108,0.25); }
.memo-cancel-btn { background: none; border: 1px solid var(--border); border-radius: 8px; padding: 6px 12px; font-size: 13px; font-family: var(--font); color: var(--text-sub); cursor: pointer; }

/* Month memo */
.section-block { background: var(--surface); border-radius: var(--radius); border: 1px solid var(--border); box-shadow: var(--shadow); padding: 16px; margin-bottom: 16px; }
.section-label { font-size: 13px; font-weight: 600; color: var(--text-sub); letter-spacing: 1px; text-transform: uppercase; margin-bottom: 8px; display: block; }
.big-textarea { width: 100%; border: 1px solid var(--border); border-radius: 10px; padding: 12px; font-size: 16px; font-family: var(--font); background: var(--bg); color: var(--text); resize: vertical; min-height: 80px; }
.big-textarea:focus { outline: none; border-color: var(--accent); }
/* PCは横幅に余裕があり折り返しが少ない分、縦が窮屈になりやすいので初期の高さを広げる */
@media (min-width: 768px) { .big-textarea { min-height: 240px; } }

/* Text view / edit pattern */
.section-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
.edit-link { background: none; border: none; color: var(--accent); font-size: 13px; font-weight: 600; cursor: pointer; font-family: var(--font); padding: 2px 0; }
.text-block-view { cursor: pointer; min-height: 36px; }
.text-content { font-size: 16px; line-height: 1.75; color: var(--text); white-space: pre-wrap; word-break: break-all; }
.text-empty { font-size: 15px; color: var(--border); }
.text-block-edit { display: none; }
.text-block-edit.open { display: block; }
.edit-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 10px; }
.btn-cancel-sm { background: none; border: 1px solid var(--border); border-radius: 50px; padding: 7px 18px; font-size: 15px; font-family: var(--font); color: var(--text-sub); cursor: pointer; }
.btn-save { background: linear-gradient(135deg, var(--g-from) 0%, var(--g-to) 100%); color: #fff; border: none; border-radius: 50px; padding: 7px 22px; font-size: 15px; font-weight: 600; font-family: var(--font); cursor: pointer; transition: opacity 0.2s; box-shadow: 0 3px 10px rgba(56,173,108,0.3); }
.btn-save:hover { opacity: 0.88; }

/* Month review items in annual tab */
.month-review-item { padding: 10px 0; border-bottom: 1px solid var(--border); }
.month-review-item:last-child { border-bottom: none; }
.month-review-label { font-size: 15px; font-weight: 700; color: var(--accent); margin-bottom: 4px; }
.month-review-body { font-size: 16px; color: var(--text); line-height: 1.65; white-space: pre-wrap; word-break: break-all; }

/* ── Annual ── */
.year-nav-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
.year-heading { font-size: 20px; font-weight: 700; }
.annual-wrap { overflow-x: auto; border-radius: var(--radius); border: 1px solid var(--border); box-shadow: var(--shadow); background: var(--surface); margin-bottom: 16px; }
.annual-table { width: 100%; border-collapse: collapse; min-width: 500px; }
.annual-table th { padding: 8px 10px; font-size: 13px; font-weight: 600; color: var(--text-sub); background: var(--surface); border-bottom: 2px solid var(--border); text-align: center; white-space: nowrap; }
.annual-table th:first-child { text-align: left; min-width: 100px; }
.annual-table td { padding: 8px 10px; border-bottom: 1px solid var(--border); text-align: center; font-size: 15px; }
.annual-table tr:last-child td { border-bottom: none; }
.annual-table td:first-child { text-align: left; font-weight: 600; }
.chip { display: inline-block; border-radius: 6px; padding: 2px 6px; font-weight: 700; font-size: 13px; }
.chip-hi { background: #E5F5EC; color: #1F7A40; }
.chip-mi { background: #FEF5E0; color: #9A6500; }
.chip-lo { background: #FEF0F0; color: #B83030; }
.chip-em { color: var(--text-sub); font-size: 12px; }

/* ── Vision Board ── */
.vb-card { background: var(--surface); border-radius: var(--radius); border: 1px solid var(--border); box-shadow: var(--shadow); overflow: hidden; margin-bottom: 16px; position: relative; }
.vb-empty { aspect-ratio: 16/9; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; cursor: pointer; border: 2px dashed var(--border); border-radius: var(--radius); color: var(--text-sub); transition: border-color 0.2s, background 0.2s; }
.vb-empty:hover { border-color: var(--accent); background: var(--accent-light); color: var(--accent); }
.vb-empty-label { font-size: 15px; font-weight: 600; }
.vb-empty-sub { font-size: 13px; }
.vb-img { width: 100%; height: auto; display: block; cursor: zoom-in; }
.vb-lb { position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 9999; display: flex; align-items: center; justify-content: center; }
.vb-lb-img { max-width: 96vw; max-height: 92vh; object-fit: contain; border-radius: 4px; display: block; will-change: transform; touch-action: none; user-select: none; }
.vb-lb { touch-action: none; }
.vb-lb-close { position: fixed; top: 14px; right: 14px; width: 38px; height: 38px; border-radius: 50%; background: rgba(255,255,255,0.18); border: none; color: #fff; font-size: 22px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: background 0.15s; }
.vb-lb-close:hover { background: rgba(255,255,255,0.32); }
.vb-del { position: absolute; top: 8px; right: 8px; width: 22px; height: 22px; border-radius: 50%; background: rgba(255,255,255,0.18); border: none; color: rgba(255,255,255,0.6); cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 11px; line-height: 1; transition: background 0.15s, color 0.15s; }
.vb-del:hover { background: rgba(180,40,40,0.7); color: #fff; }
.vb-loading { position: absolute; inset: 0; background: rgba(0,0,0,0.45); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; color: #fff; font-size: 14px; font-weight: 600; border-radius: var(--radius); }
.vb-spinner { width: 28px; height: 28px; border: 3px solid rgba(255,255,255,0.3); border-top-color: #fff; border-radius: 50%; animation: vb-spin 0.7s linear infinite; }
@keyframes vb-spin { to { transform: rotate(360deg); } }

/* ── Body composition ── */
.body-form-card { background: var(--surface); border-radius: var(--radius); border: 1px solid var(--border); box-shadow: var(--shadow); padding: 16px; margin-bottom: 16px; }
.form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin-bottom: 12px; }
.form-group { display: flex; flex-direction: column; gap: 4px; }
.form-label { font-size: 12px; font-weight: 600; color: var(--text-sub); }
.form-input { width: 100%; border: 1px solid var(--border); border-radius: 8px; padding: 9px 10px; font-size: 16px; font-family: var(--font); background: var(--bg); color: var(--text); }
.form-input:focus { outline: none; border-color: var(--accent); }
.form-sel { width: 100%; border: 1px solid var(--border); border-radius: 8px; padding: 9px 10px; font-size: 16px; font-family: var(--font); background: var(--bg); color: var(--text); }
.submit-btn { width: 100%; background: linear-gradient(135deg, var(--g-from) 0%, var(--g-to) 100%); color: #fff; border: none; border-radius: 50px; padding: 13px; font-size: 16px; font-weight: 700; font-family: var(--font); cursor: pointer; transition: opacity 0.2s; box-shadow: 0 4px 12px rgba(56,173,108,0.3); letter-spacing: 0.3px; }
.submit-btn:hover { opacity: 0.88; }
.chart-card { background: var(--surface); border-radius: var(--radius); border: 1px solid var(--border); box-shadow: var(--shadow); padding: 16px; margin-bottom: 16px; overflow-x: auto; }
.chart-label { font-size: 12px; font-weight: 600; color: var(--text-sub); letter-spacing: 1px; text-transform: uppercase; margin-bottom: 12px; }
.line-chart-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
.data-card { background: var(--surface); border-radius: var(--radius); border: 1px solid var(--border); box-shadow: var(--shadow); overflow-x: auto; }
.data-table { width: 100%; border-collapse: collapse; min-width: 300px; }
.data-table th { padding: 9px 8px; font-size: 13px; font-weight: 600; color: var(--text-sub); background: var(--surface); border-bottom: 2px solid var(--border); text-align: center; white-space: nowrap; }
.data-table td { padding: 9px 8px; border-bottom: 1px solid var(--border); text-align: center; font-size: 14px; }
.data-table tr:last-child td { border-bottom: none; }
.del-btn { background: none; border: 1px solid #E0B0B0; color: #C04040; border-radius: 6px; padding: 3px 8px; font-size: 12px; cursor: pointer; }
.del-btn:hover { background: #FEF0F0; }
.empty-msg { text-align: center; padding: 36px 16px; color: var(--text-sub); font-size: 15px; }

/* ── Time bucket ── */
.tb-prog-card { background: var(--surface); border: 1px solid var(--border); box-shadow: var(--shadow); border-radius: 12px; padding: 16px; margin-bottom: 14px; }
.tb-prog-top { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
.tb-prog-num { font-size: 28px; font-weight: 700; color: var(--tb-now-tx); line-height: 1.1; }
.tb-prog-sub { font-size: 12px; font-weight: 600; color: var(--tb-head-tx); letter-spacing: 1px; text-transform: uppercase; margin-top: 3px; }
.tb-prog-meta { font-size: 13px; color: var(--tb-head-tx); text-align: right; line-height: 1.6; white-space: nowrap; }
.tb-prog-bar { height: 8px; background: var(--tb-head-bg); border-radius: 5px; overflow: hidden; }
.tb-prog-fill { height: 100%; background: linear-gradient(135deg, var(--g-from) 0%, var(--g-to) 100%); border-radius: 5px; transition: width 0.6s ease; }
.tb-bucket { background: var(--surface); border: 1px solid var(--border); box-shadow: var(--shadow); border-radius: 12px; overflow: hidden; }
/* 中身のない年代は控えめに（中身のある年代に目が行くようにする） */
.tb-bucket.empty { background: none; border-style: dashed; box-shadow: none; }
.tb-bucket-head { display: flex; align-items: center; gap: 8px; padding: 10px 13px; background: var(--tb-head-bg); }
.tb-bucket.empty .tb-bucket-head { background: none; padding: 8px 13px; }
.tb-bucket.now .tb-bucket-head { background: var(--surface); box-shadow: inset 3px 0 0 var(--accent); }
.tb-bucket-age { font-size: 14px; font-weight: 700; color: var(--tb-head-tx); letter-spacing: 0.04em; }
.tb-bucket.empty .tb-bucket-age { font-weight: 500; color: var(--tb-empty-tx); }
.tb-bucket.now .tb-bucket-age { color: var(--tb-now-tx); }
.tb-now-badge { font-size: 11px; font-weight: 700; color: #fff; background: linear-gradient(135deg, var(--g-from) 0%, var(--g-to) 100%); border-radius: 10px; padding: 1px 8px; }
.tb-bucket-count { font-size: 12px; color: var(--tb-empty-tx); margin-left: auto; }
.tb-add-here { background: none; border: 1px solid var(--border); border-radius: 8px; width: 26px; height: 26px; font-size: 15px; line-height: 1; color: var(--tb-empty-tx); cursor: pointer; font-family: var(--font); display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: color 0.15s, border-color 0.15s; }
.tb-add-here:hover { border-color: var(--accent); color: var(--accent); background: var(--surface); }
/* 状態は「左端の細い色帯＋うすい地色」で示す（面で塗ると色が主張しすぎるため） */
.tb-item { display: flex; align-items: flex-start; gap: 10px; padding: 11px 14px 11px 11px; border-top: 1px solid var(--border); border-left: 3px solid transparent; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; transition: background 0.2s; }
.tb-item-wrap:first-of-type .tb-item { border-top: none; }
.tb-item.done { background: var(--tb-done-bg); border-left-color: var(--tb-done-bar); }
.tb-item.stopped { background: var(--tb-stop-bg); border-left-color: var(--tb-stop-bar); }
.tb-status { background: none; border: none; padding: 1px 0 0; cursor: pointer; display: flex; flex-shrink: 0; transition: transform 0.1s; }
.tb-status:active { transform: scale(0.85); }
.tb-item-body { flex: 1; min-width: 0; }
.tb-item-text { font-size: 16px; line-height: 1.5; word-break: break-word; }
.tb-item-text.stopped { color: var(--text-sub); }

/* ドラッグで年代を移動 */
.tb-drag-src { opacity: 0.3; }
.tb-drag-clone { position: fixed; z-index: 9998; pointer-events: none; background: var(--surface); border-top: none; border-radius: 10px; box-shadow: 0 10px 26px rgba(0,0,0,0.24); transform: scale(1.03); }
body.tb-dragging { cursor: grabbing; }
body.tb-dragging .tb-item { cursor: grabbing; }
.tb-bucket.tb-drop { outline: 2px solid var(--accent); outline-offset: -2px; }
.tb-bucket.tb-drop .tb-bucket-head { background: var(--accent); }
.tb-bucket.tb-drop .tb-bucket-age, .tb-bucket.tb-drop .tb-bucket-count { color: #fff; }
.tb-hint { font-size: 12px; color: var(--tb-empty-tx); text-align: center; margin: -2px 0 12px; }

};

const DEFAULT_GOALS = [
  { id: 'g1', name: '早起き',  icon: 'sunrise',    color: 'moss',  frequency: 'weekdays' },
  { id: 'g2', name: '運動',    icon: 'run',        color: 'coral', frequency: 'daily'    },
  { id: 'g3', name: '読書',    icon: 'book',       color: 'sky',   frequency: 'daily'    },
  { id: 'g4', name: '副業',    icon: 'briefcase',  color: 'plum',  frequency: 'weekdays' },
];

// 初回読み込みが成功するまで保存をブロックする。
// 読み込み失敗のままチェックを付けると、save() の merge で goals（配列は丸ごと置換）が
// デフォルト値で上書きされ、サーバー上の設定が失われるため。
let dataLoaded = false;
let saveErrorShown = false;

async function save() {
  if (!currentUser || !dataLoaded) return;
  try {
    await setDoc(doc(db, 'users', currentUser.uid), {
      goals: S.goals, checks: S.checks, memos: S.memos,
      monthMemos: S.monthMemos, yearGoals: S.yearGoals,
      yearMemos: S.yearMemos, bodyData: S.bodyData,
      buckets: S.buckets, bucketCfg: tbCfg()
    }, { merge: true });
  } catch(e) {
    console.error('Firestore save error:', e);
    if (!saveErrorShown) {
      saveErrorShown = true;
      alert('保存に失敗しました [' + (e.code || e.message) + ']');
    }
  }
}

async function loadFromFirestore() {
  if (!currentUser) return false;
  try {
    const snap = await getDoc(doc(db, 'users', currentUser.uid));
    if (snap.exists()) Object.assign(S, snap.data());
    if (!S.goals?.length) S.goals = JSON.parse(JSON.stringify(DEFAULT_GOALS));
    if (!Array.isArray(S.buckets)) S.buckets = [];
    dataLoaded = true;
    return true;
  } catch(e) {
    console.error('Firestore load error:', e);
    return false;
  }
}

async function login() {
  try {
    await signInWithPopup(auth, gProvider);
  } catch(e) {
    if (e.code === 'auth/popup-blocked') {
      // ポップアップがブロックされた場合はリダイレクトにフォールバック
      await signInWithRedirect(auth, gProvider);
    } else if (e.code !== 'auth/popup-closed-by-user') {
      alert('ログインに失敗しました: ' + e.message);
    }
  }
}

async function logout() {
  if (!confirm('ログアウトしますか？')) return;
  await signOut(auth);
}

function pad(n) { return String(n).padStart(2, '0'); }
function daysInMonth(y, m) { return new Date(y, m, 0).getDate(); }
function dow(y, m, d) { return new Date(y, m - 1, d).getDay(); }

function isActive(goal, y, m, d) {
  const w = dow(y, m, d);
  if (goal.frequency === 'daily') return true;
  if (goal.frequency === 'weekdays') return w >= 1 && w <= 5;
  if (goal.frequency === 'weekends') return w === 0 || w === 6;
  if (goal.frequency === 'monthly') return false;
  return false;
}

function ckKey(y, m, d, gid) { return `${y}-${pad(m)}/${pad(d)}-${gid}`; }
function getCheck(y, m, d, gid) { return S.checks[ckKey(y, m, d, gid)] || ''; }
function setCheck(y, m, d, gid, v) { S.checks[ckKey(y, m, d, gid)] = v; save(); }
function getMemo(y, m, d) { return S.memos[`${y}-${pad(m)}/${pad(d)}`] || ''; }
function setMemo(y, m, d, v) { S.memos[`${y}-${pad(m)}/${pad(d)}`] = v; save(); }

// Render memo text: replaces [目標名] tags with goal icons
function renderMemoText(text, showName = true) {
  if (!text || !S.goals.length) return text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/\n/g,'<br>');
  const escaped = S.goals.map(g => g.name.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'));
  const regex = new RegExp(`(\\[(?:${escaped.join('|')})\\])`, 'g');
  return text.split(regex).map(part => {
    const g = S.goals.find(x => `[${x.name}]` === part);
    if (g) {
      const c = COLORS[g.color];
      if (showName) {
        return `<span style="display:inline-flex;align-items:center;vertical-align:middle;margin:0 2px;gap:2px;background:${c.light};border-radius:6px;padding:1px 5px 1px 3px">${ico(g.icon, 13, c.primary)}<span style="color:${c.primary};font-size:11px;font-weight:600">${g.name}</span></span>`;
      } else {
        return `<span style="display:inline-flex;align-items:center;vertical-align:middle;margin:0 1px">${ico(g.icon, 13, c.primary)}</span>`;
      }
    }
    return part.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/\n/g,'<br>');
  }).join('');
}

function calcAch(y, m, gid) {
  const g = S.goals.find(x => x.id === gid); if (!g) return null;
  // 未来の月はまだ始まっていないので集計対象外（「−」表示）
  if (y > TODAY.getFullYear() || (y === TODAY.getFullYear() && m > TODAY.getMonth() + 1)) return null;
  const days = daysInMonth(y, m);
  // 月1回: 月内のどこか1日でも○があれば100%
  if (g.frequency === 'monthly') {
    for (let d = 1; d <= days; d++) {
      const ck = getCheck(y, m, d, gid);
      if (ck === '◎' || ck === '◯') return 100;
    }
    return 0;
  }
  let done = 0, total = 0;
  for (let d = 1; d <= days; d++) {
    if (y === TODAY.getFullYear() && m === TODAY.getMonth()+1 && d > TODAY.getDate()) continue;
    const ck = getCheck(y, m, d, gid);
    const active = isActive(g, y, m, d);
    const achieved = ck === '◎' || ck === '◯';
    if (active || achieved) {
      total++;
      if (achieved) done++;
    }
  }
  return total === 0 ? null : Math.round(done / total * 100);
}


// Convert Hugeicons [tag, camelCaseAttrs][] to SVG HTML string
function ico(name, size, color) {
  const iconData = ICONS[name];
  const sz = size || 20;
  const c = color || 'currentColor';
  if (!Array.isArray(iconData)) return `<svg width="${sz}" height="${sz}" viewBox="0 0 24 24"></svg>`;
  const paths = iconData.map(([tag, attrs]) => {
    const attrStr = Object.entries(attrs).map(([k, v]) => {
      const key = k.replace(/([A-Z])/g, m => '-' + m.toLowerCase());
      const val = v === 'currentColor' ? c : v;
      return `${key}="${val}"`;
    }).join(' ');
    return `<${tag} ${attrStr}/>`;
  }).join('');
  return `<svg width="${sz}" height="${sz}" viewBox="0 0 24 24" fill="none">${paths}</svg>`;
}

function ring(pct, primary, size) {
  size = size||72; const cx = size/2, r = cx-7, circ = 2*Math.PI*r;
  const off = pct===null ? circ : circ*(1-pct/100);
  const txt = pct===null ? '−' : pct+'%';
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
    <circle cx="${cx}" cy="${cx}" r="${r}" fill="none" stroke="var(--border)" stroke-width="5"/>
    <circle cx="${cx}" cy="${cx}" r="${r}" fill="none" stroke="${primary}" stroke-width="5" stroke-linecap="round"
      stroke-dasharray="${circ.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}"
      transform="rotate(-90 ${cx} ${cx})" style="transition:stroke-dashoffset 0.7s ease"/>
    <text x="${cx}" y="${cx+1}" text-anchor="middle" dominant-baseline="middle"
      font-family="'Noto Sans JP',sans-serif" font-size="${pct===null?10:12}" font-weight="700" fill="var(--text)">${txt}</text>
  </svg>`;
}

function updateCheckBtn(y, m, d, gid) {
  const btn = document.querySelector(`.check-btn[data-y="${y}"][data-m="${m}"][data-d="${d}"][data-gid="${gid}"]`);
  if (!btn) return;
  const g = S.goals.find(x => x.id === gid);
  const c = g ? COLORS[g.color] : null;
  const ck = getCheck(y, m, d, gid);
  const active = g ? isActive(g, y, m, d) : true;
  btn.innerHTML = ck === '◯' ? SYM_OK : ck === '×' ? SYM_NG : `<span style="font-size:12px">${active ? '' : '−'}</span>`;
  btn.style.color = (ck === '◯' || ck === '×') ? (c ? c.primary : 'var(--accent)') : 'var(--text-sub)';
}

// ── Navigate ──
function navigate(tab) {
  S.tab = tab;

  document.querySelectorAll('.page').forEach(p => p.classList.toggle('active', p.id === 'page-' + tab));

  if (tab === 'annual') renderAnnual();
  if (tab === 'body') renderBody();
  if (tab === 'bucket') renderBucket();

// HTML本文・属性値の両方で使えるエスケープ
function esc(s) {
  return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ── Text block helper (view/edit toggle) ──
function setupTextBlock(id, placeholder, onSave, renderer) {
  const view   = document.getElementById(id + '-view');
  const editor = document.getElementById(id + '-editor');
  const editBtn = document.getElementById(id + '-edit-btn');
  if (!view || !editor) return;

  function openEdit() {
    view.style.display = 'none';
    if (editBtn) editBtn.style.display = 'none';
    editor.classList.add('open');
    const ta = editor.querySelector('textarea');
    if (ta) { ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length); }
  }
  function closeEdit(val) {
    view.style.display = '';
    if (editBtn) editBtn.style.display = '';
    editor.classList.remove('open');
    if (val !== undefined) {
      const rendered = renderer
        ? renderer(val)
        : val.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/\n/g,'<br>');
      view.innerHTML = val
        ? `<div class="text-content">${rendered}</div>`
        : `<div class="text-empty">${placeholder}</div>`;
    }
  }

  view.addEventListener('click', openEdit);
  if (editBtn) editBtn.addEventListener('click', openEdit);
  editor.querySelector('.btn-cancel-sm').addEventListener('click', () => closeEdit());
  editor.querySelector('.btn-save').addEventListener('click', () => {
    const val = editor.querySelector('textarea').value;
    onSave(val);
    closeEdit(val);
  });
}

function changeMonth(delta) {
  S.month += delta;
  if (S.month < 1) { S.month = 12; S.year--; }
  if (S.month > 12) { S.month = 1; S.year++; }
  S.openMemoDay = null;
  renderCalendar();
}

// 左右スワイプでページ送りする汎用ハンドラ。
// リスナーはコンテナ自体に付けるので、innerHTML の再描画後も生き続ける。
// opts.exclude: この中で始まったタッチは無視（入力欄など）
// opts.hScroll: 横スクロール領域。実際にスクロールした場合はスワイプ扱いしない
// opts.onSwipe: 左スワイプで +1、右スワイプで -1 が渡る
function setupSwipeNav(pageId, opts) {
  const page = document.getElementById(pageId);
  let startX = 0, startY = 0, startTime = 0, tracking = false;
  let scrollEl = null, scrollLeft0 = 0;

  page.addEventListener('touchstart', e => {
    tracking = false;
    if (e.touches.length !== 1) return;
    if (e.target.closest(opts.exclude)) return;
    tracking = true;
    startX = e.touches[0].clientX;
    startY = e.touches[0].clientY;
    startTime = Date.now();
    scrollEl = e.target.closest(opts.hScroll);
    scrollLeft0 = scrollEl ? scrollEl.scrollLeft : 0;
  }, { passive: true });

  page.addEventListener('touchend', e => {
    if (!tracking || e.touches.length > 0) return;
    tracking = false;
    const dx = e.changedTouches[0].clientX - startX;
    const dy = e.changedTouches[0].clientY - startY;
    if (Date.now() - startTime > 600) return;               // ゆっくりした動きは無視
    if (Math.abs(dx) < 60) return;                          // 移動量が小さい
    if (Math.abs(dy) > Math.abs(dx) * 0.6) return;          // 縦方向の動きが強い＝縦スクロール
    if (scrollEl && Math.abs(scrollEl.scrollLeft - scrollLeft0) > 2) return; // 横スクロールだった
    opts.onSwipe(dx < 0 ? 1 : -1);
  }, { passive: true });
}

function buildCalHTML() {
  const y = S.year, m = S.month, days = daysInMonth(y, m);
  const goals = S.goals;

  // Rings
  const ringsHTML = goals.map(g => {
    const c = COLORS[g.color], pct = calcAch(y, m, g.id);
    return `<div class="ring-item">
      <div class="ring-wrapper">${ring(pct, c.primary, 68)}</div>
      <div class="ring-name">${ico(g.icon, 14, c.primary)}<span>${g.name}</span></div>
    </div>`;
  }).join('');

  // Table header
  const thGoals = goals.map(g => {
    const c = COLORS[g.color];
    return `<th><div class="th-icon">${ico(g.icon,20,c.primary)}<span style="font-size:11px;color:${c.primary};font-weight:600">${g.name}</span></div></th>`;
  }).join('');

  // Table body
  let rows = '';
  for (let d = 1; d <= days; d++) {
    const w = dow(y, m, d);
    const isSun = w === 0, isSat = w === 6;
    const isToday = y === TODAY.getFullYear() && m === TODAY.getMonth()+1 && d === TODAY.getDate();
    const memo = getMemo(y, m, d);
    const memoOpen = S.openMemoDay === d;

    // 土日の行に背景色は付けない（日付の文字色だけで区別する）
    let rowCls = 'cal-day-row';
    if (isToday) rowCls += ' today';
    let dateCls = 'date-cell';
    if (isSun) dateCls += ' is-sun';
    if (isSat) dateCls += ' is-sat';

    const numHTML = isToday
      ? `<span class="today-circle">${d}</span>`
      : `<span class="date-num">${d}</span>`;

    const checks = goals.map(g => {
      const c = COLORS[g.color];
      const active = isActive(g, y, m, d);
      const ck = getCheck(y, m, d, g.id);
      const displayHTML = ck === '◯' ? SYM_OK : ck === '×' ? SYM_NG : `<span style="font-size:12px">${active ? '' : '−'}</span>`;
      const color = (ck === '◯' || ck === '×') ? c.primary : 'var(--text-sub)';
      return `<td class="check-cell">
        <button class="check-btn" data-y="${y}" data-m="${m}" data-d="${d}" data-gid="${g.id}"
          style="color:${color}">${displayHTML}</button>
      </td>`;
    }).join('');

    const memoCell = memo
      ? `<span class="memo-preview-text" data-day="${d}">${renderMemoText(memo, false)}</span>`
      : `<span class="memo-add-btn" data-day="${d}">＋</span>`;

    const colCount = goals.length + 2;

    rows += `<tr class="${rowCls}">
      <td class="${dateCls}">${numHTML}<div class="date-dow">${DOW[w]}</div></td>
      ${checks}
      <td class="memo-cell">${memoCell}</td>
    </tr>
    <tr class="memo-edit-row${memoOpen?' open':''}" id="medit-${d}">
      <td colspan="${colCount}">
        <div class="memo-edit-inner">
          <div class="memo-goal-tags">${goals.map(g => {
            const c = COLORS[g.color];
            return `<button class="memo-tag-btn" style="background:${c.light};color:${c.accent}" data-insert="${g.name}" data-day="${d}">${g.name}</button>`;
          }).join('')}</div>
          <textarea class="memo-textarea" data-y="${y}" data-m="${m}" data-d="${d}" placeholder="メモを入力...">${memo}</textarea>
          <div class="memo-actions">
            <button class="memo-cancel-btn" data-day="${d}">キャンセル</button>
            <button class="memo-save-btn" data-y="${y}" data-m="${m}" data-day="${d}">保存</button>
          </div>
        </div>
      </td>
    </tr>`;
  }

  const monthMemo = S.monthMemos[`${y}-${pad(m)}`] || '';

  return `
    <div class="card">
      <div class="card-header">
        <div class="month-nav-row" style="width:100%;padding:0">
          <button class="nav-arrow-btn" id="prev-m">&#8249;</button>
          <span class="month-heading">${y}年 ${m}月</span>
          <button class="nav-arrow-btn" id="next-m">&#8250;</button>
        </div>
      </div>
      <div class="rings-row">${ringsHTML || '<span style="color:var(--text-sub);font-size:13px;padding:16px">目標を追加してください</span>'}</div>
    </div>
    <div class="card" style="padding:0">
      <div class="table-wrap">
        <table class="cal-table">
          <thead><tr>
            <th style="text-align:left;padding-left:12px">日付</th>
            ${thGoals}
            <th class="th-memo">メモ</th>
          </tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>
    </div>
    <div class="section-block">
      <div class="section-row">
        <span class="section-label">月のまとめ</span>
        <button class="edit-link" id="month-memo-edit-btn">編集</button>
      </div>
      <div class="text-block-view" id="month-memo-view">
        ${monthMemo ? `<div class="text-content">${renderMemoText(monthMemo)}</div>` : '<div class="text-empty">タップして追加...</div>'}
      </div>
      <div class="text-block-edit" id="month-memo-editor">
        <div class="memo-goal-tags" id="month-memo-tags">${goals.map(g => {
          const c = COLORS[g.color];
          return `<button class="memo-tag-btn month-memo-tag" style="background:${c.light};color:${c.primary}" data-insert="${g.name}">${ico(g.icon,13,c.primary)} ${g.name}</button>`;
        }).join('')}</div>
        <textarea class="big-textarea" id="month-memo-ta" placeholder="この月の振り返りや感想...">${monthMemo}</textarea>
        <div class="edit-actions">
          <button class="btn-cancel-sm" id="month-memo-cancel">キャンセル</button>
          <button class="btn-save" id="month-memo-save">保存</button>
        </div>
      </div>
    </div>`;
}

function bindCalEvents() {
  document.getElementById('prev-m').onclick = () => changeMonth(-1);
  document.getElementById('next-m').onclick = () => changeMonth(1);

  // Check buttons — click cycles: '' → '◯' → '×' → ''
  document.querySelectorAll('.check-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const y = +btn.dataset.y, m = +btn.dataset.m, d = +btn.dataset.d, gid = btn.dataset.gid;
      const ck = getCheck(y, m, d, gid);
      const next = ck === '' ? '◯' : ck === '◯' ? '×' : '';
      setCheck(y, m, d, gid, next);
      updateCheckBtn(y, m, d, gid);
      refreshRings();
    });
  });

  // Memo open (click preview text or + btn)
  document.querySelectorAll('.memo-preview-text, .memo-add-btn').forEach(el => {
    el.addEventListener('click', () => {
      const d = +el.dataset.day;
      S.openMemoDay = S.openMemoDay === d ? null : d;
      renderCalendar();
      if (S.openMemoDay) {
        setTimeout(() => {
          const ta = document.querySelector(`#medit-${d} .memo-textarea`);
          if (ta) { ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length); }
        }, 50);
      }
    });
  });

  // Memo tag insert
  document.querySelectorAll('.memo-tag-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const d = btn.dataset.day;
      const ta = document.querySelector(`#medit-${d} .memo-textarea`);
      if (!ta) return;
      const ins = `[${btn.dataset.insert}] `;
      const pos = ta.selectionStart;
      ta.value = ta.value.slice(0, pos) + ins + ta.value.slice(pos);
      ta.selectionStart = ta.selectionEnd = pos + ins.length;
      ta.focus();
    });
  });

  // Memo save
  document.querySelectorAll('.memo-save-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const d = +btn.dataset.day;
      const ta = document.querySelector(`#medit-${d} .memo-textarea`);
      if (!ta) return;
      setMemo(+btn.dataset.y, +btn.dataset.m, d, ta.value);
      S.openMemoDay = null;
      renderCalendar();
    });
  });

  // Memo cancel
  document.querySelectorAll('.memo-cancel-btn').forEach(btn => {
    btn.addEventListener('click', () => { S.openMemoDay = null; renderCalendar(); });
  });

  // Month memo icon stamp buttons
  document.querySelectorAll('.month-memo-tag').forEach(btn => {
    btn.addEventListener('click', () => {
      const ta = document.getElementById('month-memo-ta');
      if (!ta) return;
      const ins = `[${btn.dataset.insert}] `;
      const pos = ta.selectionStart;
      ta.value = ta.value.slice(0, pos) + ins + ta.value.slice(pos);
      ta.selectionStart = ta.selectionEnd = pos + ins.length;
      ta.focus();
    });
  });

  // Month memo
  setupTextBlock('month-memo', 'この月の振り返りや感想...', val => {
    S.monthMemos[`${S.year}-${pad(S.month)}`] = val; save();
  }, renderMemoText);
}

function refreshRings() {
  const items = document.querySelectorAll('.ring-item');
  items.forEach((item, i) => {
    const g = S.goals[i]; if (!g) return;
    const c = COLORS[g.color], pct = calcAch(S.year, S.month, g.id);
    const wrap = item.querySelector('.ring-wrapper');
    wrap.innerHTML = ring(pct, c.primary, 68);
  });
}

// ── Annual ──
function changeYear(delta) {
  S.annualYear += delta;
  renderAnnual();
}

function renderAnnual() {
  const el = document.getElementById('page-annual');
  const y = S.annualYear;
  const goals = S.goals;

  const mos = ['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];
  const thMos = mos.map(mo => `<th>${mo}</th>`).join('');

  const rows = goals.map(g => {
    const c = COLORS[g.color];
    let cells = ''; let yD = 0, yT = 0;
    for (let mo = 1; mo <= 12; mo++) {
      const pct = calcAch(y, mo, g.id);
      if (pct === null) { cells += `<td><span class="chip-em">−</span></td>`; continue; }
      const cls = pct >= 80 ? 'chip-hi' : pct >= 50 ? 'chip-mi' : 'chip-lo';
      cells += `<td><span class="chip ${cls}">${pct}%</span></td>`;
      const dd = daysInMonth(y, mo);
      for (let d = 1; d <= dd; d++) {
        if (!isActive(g, y, mo, d)) continue;

// ── Vision board helpers ──────────────────────────────────────────────────
// 画像を Canvas でリサイズ・圧縮して JPEG Base64 を返す（2段階圧縮）
function compressImage(file) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    const blobUrl = URL.createObjectURL(file);
    img.onload = () => {
      URL.revokeObjectURL(blobUrl);
      function encode(maxW, quality) {
        let w = img.naturalWidth, h = img.naturalHeight;
        if (w > maxW) { h = Math.round(h * maxW / w); w = maxW; }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        return canvas.toDataURL('image/jpeg', quality);
      }
      let data = encode(800, 0.65);
      // 750KB 超えたらさらに圧縮
      if (data.length > 750 * 1024) data = encode(640, 0.55);
      resolve(data);
    };
    img.onerror = () => { URL.revokeObjectURL(blobUrl); reject(new Error('画像の読み込みに失敗しました')); };
    img.src = blobUrl;
  });
}

// サブコレクション users/{uid}/visionBoards/{year} に保存
// （メインドキュメントに入れると画像2年分でFirestoreの1MB/doc制限を超えるため分離）
async function saveVisionBoard(y, data) {
  if (!currentUser) return;
  const ref = doc(db, 'users', currentUser.uid, 'visionBoards', String(y));
  if (data) {
    await setDoc(ref, { data });
  } else {
    await deleteDoc(ref);
  }
}

// 旧形式（メインドキュメントの visionBoards フィールド）からの移行。
// 移行済みならフィールドが存在しないので何もしない。
async function migrateVisionBoards() {
  if (!currentUser || !S.visionBoards) return;
  const years = Object.keys(S.visionBoards).filter(k => S.visionBoards[k]);
  if (!years.length) return;
  try {
    for (const yr of years) {
      await setDoc(doc(db, 'users', currentUser.uid, 'visionBoards', String(yr)), { data: S.visionBoards[yr] });
    }
    await updateDoc(doc(db, 'users', currentUser.uid), { visionBoards: deleteField() });
  } catch (e) {
    console.error('visionBoard migration error:', e);
  }
}

// 年のビジョンボードを取得（S.visionBoards をメモリキャッシュとして使用）
async function fetchVisionBoard(y) {
  if (!S.visionBoards) S.visionBoards = {};
  if (y in S.visionBoards) return S.visionBoards[y];
  if (!currentUser) return null;
  try {
    const snap = await getDoc(doc(db, 'users', currentUser.uid, 'visionBoards', String(y)));
    const data = snap.exists() ? snap.data().data : null;
    S.visionBoards[y] = data;
    return data;
  } catch (e) {
    console.error('visionBoard fetch error:', e);
    return null;
  }
}

function initVisionBoard(y) {
  const elImg    = document.getElementById('vb-img');
  const elDel    = document.getElementById('vb-del');
  const elEmpty  = document.getElementById('vb-empty');
  const elInput  = document.getElementById('vb-input');
  const elLoader = document.getElementById('vb-loading');

  function show(data) {
    elImg.src = data;
    elImg.style.display = '';
    elDel.style.display = '';
    elEmpty.style.display = 'none';
  }
  function clear() {
    elImg.style.display = 'none';
    elDel.style.display = 'none';
    elEmpty.style.display = '';
    elImg.src = '';
  }
  function setLoading(on) {
    elLoader.style.display = on ? '' : 'none';
  }

  // キャッシュがあれば即表示、なければサブコレクションから非同期取得
  const cached = S.visionBoards && S.visionBoards[y];
  if (cached) show(cached);
  else {
    clear();
    fetchVisionBoard(y).then(data => {
      // 取得中に別の年へ移動していたら反映しない
      if (data && S.annualYear === y) show(data);
    });
  }

  // ライトボックス
  const elLb      = document.getElementById('vb-lb');
  const elLbImg   = document.getElementById('vb-lb-img');
  const elLbClose = document.getElementById('vb-lb-close');

  let lbScale = 1, lbTx = 0, lbTy = 0;
  let lbPinchDist0 = null, lbScale0 = 1;
  let lbDragStart = null, lbTx0 = 0, lbTy0 = 0;
  let lbLastTap = 0;

  function applyLbTransform() {
    elLbImg.style.transform = `translate(${lbTx}px,${lbTy}px) scale(${lbScale})`;
  }
  function resetLbTransform() {
    lbScale = 1; lbTx = 0; lbTy = 0;
    applyLbTransform();
  }
  function pinchDist(touches) {
    return Math.hypot(touches[0].clientX - touches[1].clientX, touches[0].clientY - touches[1].clientY);
  }

  elLb.addEventListener('touchstart', e => {
    if (e.touches.length === 2) {
      lbPinchDist0 = pinchDist(e.touches);
      lbScale0 = lbScale;
      lbDragStart = null;
    } else if (e.touches.length === 1) {
      const now = Date.now();
      if (now - lbLastTap < 280) { resetLbTransform(); lbLastTap = 0; return; }
      lbLastTap = now;
      lbDragStart = { x: e.touches[0].clientX, y: e.touches[0].clientY };
      lbTx0 = lbTx; lbTy0 = lbTy;
    }
  }, { passive: true });

  elLb.addEventListener('touchmove', e => {
    e.preventDefault();
    if (e.touches.length === 2 && lbPinchDist0 !== null) {
      lbScale = Math.min(5, Math.max(0.5, lbScale0 * pinchDist(e.touches) / lbPinchDist0));
      applyLbTransform();
    } else if (e.touches.length === 1 && lbDragStart && lbScale > 1) {
      lbTx = lbTx0 + e.touches[0].clientX - lbDragStart.x;
      lbTy = lbTy0 + e.touches[0].clientY - lbDragStart.y;
      applyLbTransform();
    }
  }, { passive: false });

  elLb.addEventListener('touchend', e => {
    if (e.touches.length < 2) lbPinchDist0 = null;
    if (e.touches.length === 0) lbDragStart = null;
  }, { passive: true });

  function openLb() {
    elLbImg.src = elImg.src;
    resetLbTransform();
    elLb.style.display = '';
    document.body.style.overflow = 'hidden';
  }
  function closeLb() {
    elLb.style.display = 'none';
    document.body.style.overflow = '';
  }
  elLbClose.onclick = e => { e.stopPropagation(); closeLb(); };
  elLb.onclick = e => { if (e.target === elLb) closeLb(); };
  elLbImg.onclick = e => e.stopPropagation();

  elEmpty.onclick = () => elInput.click();
  elImg.onclick   = openLb;

  elDel.onclick = async e => {
    e.stopPropagation();
    setLoading(true);
    try {
      await saveVisionBoard(y, null);
      if (!S.visionBoards) S.visionBoards = {};
      S.visionBoards[y] = null;
      clear();
    } catch(err) {
      console.error('visionBoard delete error:', err);
      alert('削除に失敗しました [' + (err.code || err.message) + ']');
    } finally {
      setLoading(false);
    }
  };

  elInput.onchange = async e => {
    const file = e.target.files[0];
    if (!file) return;
    elInput.value = '';
    setLoading(true);
    try {
      const data = await compressImage(file);
      await saveVisionBoard(y, data);
      if (!S.visionBoards) S.visionBoards = {};
      S.visionBoards[y] = data;
      show(data);
    } catch(err) {
      console.error('visionBoard upload error:', err);
      alert('アップロードに失敗しました [' + (err.code || err.message) + ']');
    } finally {
      setLoading(false);
    }
  };
}

function bodyKeyLabel(key) {

  return `${p[0]}年${parseInt(p[1])}月`;

function bodyBarLabel(key) {

  if (p.length >= 3) return `${parseInt(p[1])}/${parseInt(p[2])}`;
  return `${parseInt(p[1])}月`;
}

function makeLineChart(items, key, color) {
  const n = items.length;
  if (!n) return '';
  const W = Math.max(320, n * 44);
  const H = 130, padT = 28, padB = 22, padL = 28, padR = 28;
  const plotW = W - padL - padR, plotH = H - padT - padB;
  const vals = items.map(r => r[key] ?? null);
  const valid = vals.filter(v => v !== null);
  if (!valid.length) return `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" style="display:block"><text x="${W/2}" y="${H/2}" text-anchor="middle" font-size="11" fill="var(--text-sub)" font-family="'Noto Sans JP',sans-serif">データなし</text></svg>`;
  const minV = Math.min(...valid), maxV = Math.max(...valid);
  const range = maxV - minV;
  const vy = v => range ? padT + plotH - ((v - minV) / range) * plotH : padT + plotH / 2;
  const vx = i => padL + (n === 1 ? plotW / 2 : (i / (n - 1)) * plotW);
  let grid = '';
  for (let g = 0; g <= 3; g++) {
    const y = (padT + (plotH / 3) * g).toFixed(1);
    grid += `<line x1="${padL}" y1="${y}" x2="${W - padR}" y2="${y}" stroke="var(--border)" stroke-width="0.8"/>`;
  }
  let lines = '', seg = [];
  for (let i = 0; i < n; i++) {
    if (vals[i] !== null) {
      seg.push(`${vx(i).toFixed(1)},${vy(vals[i]).toFixed(1)}`);
    } else {
      if (seg.length >= 2) lines += `<polyline points="${seg.join(' ')}" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>`;
      seg = [];
    }
  }
  if (seg.length >= 2) lines += `<polyline points="${seg.join(' ')}" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>`;
  let dots = '', vlbls = '', xlbls = '';
  for (let i = 0; i < n; i++) {
    const x = vx(i).toFixed(1);
    const anchor = i === 0 ? 'start' : i === n - 1 ? 'end' : 'middle';
    xlbls += `<text x="${x}" y="${H - 4}" text-anchor="${anchor}" font-size="10" font-family="'Noto Sans JP',sans-serif" fill="var(--text-sub)">${bodyBarLabel(items[i].key)}</text>`;
    if (vals[i] !== null) {
      const y = vy(vals[i]).toFixed(1);
      dots += `<circle cx="${x}" cy="${y}" r="4" fill="${color}" stroke="var(--surface)" stroke-width="1.5"/>`;
      vlbls += `<text x="${x}" y="${(parseFloat(y) - 9).toFixed(1)}" text-anchor="${anchor}" font-size="11" font-weight="600" font-family="'Noto Sans JP',sans-serif" fill="${color}">${vals[i]}</text>`;
    }
  }
  return `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" style="display:block">${grid}${lines}${dots}${vlbls}${xlbls}</svg>`;
}

// ── Time bucket ───────────────────────────────────────────────────────────
// 設定値を安全な数値に正規化して返す（壊れた値でも描画が壊れないようにする）
function tbCfg() {
  const c = S.bucketCfg || {};
  const num = (v, fb) => {
    const n = Math.floor(+v);
    return (v !== null && v !== '' && Number.isFinite(n)) ? n : fb;
  };
  const cfg = {
    birthYear: num(c.birthYear, DEFAULT_BUCKET_CFG.birthYear),
    startAge:  num(c.startAge,  DEFAULT_BUCKET_CFG.startAge),
    step:      num(c.step,      DEFAULT_BUCKET_CFG.step),
    endAge:    num(c.endAge,    DEFAULT_BUCKET_CFG.endAge),
  };
  if (cfg.step < 1) cfg.step = DEFAULT_BUCKET_CFG.step;   // 0以下だと無限ループになる
  if (cfg.endAge < cfg.startAge) cfg.endAge = cfg.startAge;
  return cfg;
}

function tbMakeRanges(startAge, step, endAge) {
  const out = [];
  for (let a = startAge; a <= endAge && out.length < 60; a += step) {
    out.push({ start: a, end: Math.min(a + step - 1, endAge) });
  }
  return out;
}

function tbRanges() { const c = tbCfg(); return tbMakeRanges(c.startAge, c.step, c.endAge); }
function tbLabel(r) { return r.start === r.end ? `${r.start}歳` : `${r.start}-${r.end}歳`; }
function tbAge() { return TODAY.getFullYear() - tbCfg().birthYear; }

// 項目を年代ごとに振り分ける。範囲外・未設定はそれぞれ別枠にまとめる
function tbGroups() {
  const groups = tbRanges().map(r => ({ ...r, items: [] }));
  const outRange = [], unset = [];
  const items = [...(S.buckets || [])].sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));
  items.forEach(it => {
    if (!Number.isFinite(it.age)) { unset.push(it); return; }
    const g = groups.find(r => it.age >= r.start && it.age <= r.end);
    (g ? g.items : outRange).push(it);
  });
  return { groups, outRange, unset };
}

function tbAgeOptions(selAge) {
  const ranges = tbRanges();
  const inRange = Number.isFinite(selAge) && ranges.some(r => selAge >= r.start && selAge <= r.end);
  let opts = ranges.map(r => {
    const sel = Number.isFinite(selAge) && selAge >= r.start && selAge <= r.end;
    return `<option value="${r.start}"${sel ? ' selected' : ''}>${tbLabel(r)}</option>`;
  }).join('');
  // 設定範囲を狭めた後の項目：元の年齢を選択肢に残し、勝手に別の年代へ移さない
  if (Number.isFinite(selAge) && !inRange) opts += `<option value="${selAge}" selected>${selAge}歳（範囲外）</option>`;
  opts += `<option value=""${Number.isFinite(selAge) ? '' : ' selected'}>未設定</option>`;
  return opts;
}

function tbItemHTML(it) {
  const st = TB_STATUS[it.status] ? it.status : 'active';
  // 状態はカードの色で分かるので、達成年齢だけ1行内に小さく添える
  const ageTag = st === 'done' && Number.isFinite(it.doneAge)
    ? `<span class="tb-done-age">${it.doneAge}歳</span>` : '';
  const stOpts = Object.keys(TB_STATUS)
    .map(k => `<option value="${k}"${k === st ? ' selected' : ''}>${TB_STATUS[k]}</option>`).join('');
  return `<div class="tb-item-wrap">
    <div class="tb-item ${st}">
      <button class="tb-status" data-id="${esc(it.id)}" style="color:${TB_COLOR[st]}" title="${TB_STATUS[st]}（タップで切替）">${TB_SYM[st]}</button>
      <div class="tb-item-body">
        <div class="tb-item-text ${st}">${esc(it.text)}</div>
      </div>
      ${ageTag}
      <button class="tb-item-edit" data-id="${esc(it.id)}" title="編集">${SYM_PENCIL}</button>
    </div>
    <div class="tb-edit-form" id="tb-edit-${esc(it.id)}">
      <span class="field-lbl">やりたいこと</span>
      <input class="text-input" id="tb-e-text-${esc(it.id)}" type="text" value="${esc(it.text)}">
      <span class="field-lbl">年代</span>
      <select class="freq-sel" id="tb-e-age-${esc(it.id)}">${tbAgeOptions(it.age)}</select>

      <select class="freq-sel" id="tb-e-st-${esc(it.id)}">${stOpts}</select>

        <span class="field-lbl">達成した年齢</span>

      </div>
      <div class="tb-edit-actions">
        <button class="tb-del-btn" data-id="${esc(it.id)}">削除</button>
        <span style="flex:1"></span>
        <button class="tb-cancel-btn" data-id="${esc(it.id)}">キャンセル</button>
        <button class="tb-save-btn" data-id="${esc(it.id)}">保存する</button>
      </div>
    </div>
  </div>`;
}

function renderBucket() {
  const el = document.getElementById('page-bucket');
  const items = S.buckets || [];
  const age = tbAge();
  const { groups, outRange, unset } = tbGroups();
  const doneN = items.filter(i => i.status === 'done').length;
  const stopN = items.filter(i => i.status === 'stopped').length;
  const denom = items.length - stopN;   // 中止は分母に入れない
  const pct = denom > 0 ? Math.round(doneN / denom * 100) : 0;
  const nowG = groups.find(g => age >= g.start && age <= g.end);

  // dropAge に null を渡した枠はドラッグの受け入れ先にしない（範囲外は年代が決まらないため）
  const extraSection = (title, list, dropAge) => list.length ? `<div class="tb-bucket"${dropAge === null ? '' : ` data-drop-age="${dropAge}"`}>
      <div class="tb-bucket-head">
        <span class="tb-bucket-age">${title}</span>
        <span class="tb-bucket-count">${list.length}件</span>
      </div>
      ${list.map(tbItemHTML).join('')}
    </div>` : '';

  const bucketHTML = groups.map(g => {
    const isNow = nowG && g.start === nowG.start;
    const cls = (isNow ? ' now' : '') + (g.items.length ? '' : ' empty');
    return `<div class="tb-bucket${cls}" data-drop-age="${g.start}">
      <div class="tb-bucket-head">
        <span class="tb-bucket-age">${tbLabel(g)}</span>
        ${isNow ? '<span class="tb-now-badge">いま</span>' : ''}
        <span class="tb-bucket-count">${g.items.length ? g.items.length + '件' : ''}</span>
        <button class="tb-add-here" data-age="${g.start}" title="この年代に追加">＋</button>
      </div>
      ${g.items.map(tbItemHTML).join('')}
    </div>`;
  }).join('');

  el.innerHTML = `
    <div class="tb-prog-card">
      <div class="tb-prog-top">
        <div>
          <div class="tb-prog-num">${pct}%</div>
          <div class="tb-prog-sub">達成率</div>
        </div>
        <div class="tb-prog-meta">
          ${items.length ? `${doneN} / ${denom} 件 達成${stopN ? `<br>中止 ${stopN}件` : ''}` : 'まだ登録がありません'}<br>
          いま ${age}歳${nowG ? `・${tbLabel(nowG)}` : ''}
        </div>
      </div>
      <div class="tb-prog-bar"><div class="tb-prog-fill" style="width:${pct}%"></div></div>
    </div>

    <div class="tb-hint">カードを長押しすると、ドラッグで年代を移動できます</div>

    <div class="tb-buckets">
      ${bucketHTML}
      ${extraSection('範囲外', outRange, null)}
      ${extraSection('未設定', unset, '')}
    </div>

    <button class="tb-fab" id="tb-fab" title="やりたいことを追加">＋</button>`;

  bindBucketEvents();
}

// 追加はモーダル（ボトムシート）で行う。常設の入力欄は置かない
function tbOpenAddModal(presetAge) {
  const modal = document.getElementById('modal-body');
  const stOpts = Object.keys(TB_STATUS)
    .map(k => `<option value="${k}"${k === 'active' ? ' selected' : ''}>${TB_STATUS[k]}</option>`).join('');
  modal.innerHTML = `
    <div class="tb-modal-head">
      <div class="modal-h">やりたいことを追加</div>
      <button class="tb-modal-close" id="tb-a-close" title="閉じる">✕</button>
    </div>
    <span class="field-lbl">やりたいこと</span>
    <input class="text-input" id="tb-a-text" type="text" placeholder="例：オーロラを見に行く">
    <span class="field-lbl">年代</span>
    <select class="freq-sel" id="tb-a-age">${tbAgeOptions(presetAge)}</select>
    <span class="field-lbl">状態</span>
    <select class="freq-sel" id="tb-a-st">${stOpts}</select>
    <div id="tb-a-donewrap" style="display:none">
      <span class="field-lbl">達成した年齢</span>
      <input class="text-input" id="tb-a-done" type="number" placeholder="${tbAge()}">
    </div>
    <button class="add-goal-btn" id="tb-a-save">追加する</button>`;
  document.getElementById('overlay').classList.add('open', 'center');
  modal.querySelector('#tb-a-close').onclick = closeModal;

  const input = modal.querySelector('#tb-a-text');
  const stSel = modal.querySelector('#tb-a-st');
  stSel.onchange = () => {
    modal.querySelector('#tb-a-donewrap').style.display = stSel.value === 'done' ? '' : 'none';
  };

  const submit = () => {
    const text = input.value.trim();
    if (!text) { alert('やりたいことを入力してください'); input.focus(); return; }
    const ageVal  = modal.querySelector('#tb-a-age').value;
    const st      = TB_STATUS[stSel.value] ? stSel.value : 'active';
    const doneVal = modal.querySelector('#tb-a-done').value;
    if (!Array.isArray(S.buckets)) S.buckets = [];
    S.buckets.push({
      id: 'tb' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
      text,
      age: ageVal === '' ? null : +ageVal,
      status: st,
      doneAge: st === 'done' ? (doneVal === '' ? tbAge() : Math.floor(+doneVal)) : null,
      createdAt: Date.now(),
    });
    save();
    closeModal();
    renderBucket();
  };
  modal.querySelector('#tb-a-save').onclick = submit;
  input.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); submit(); } });
  setTimeout(() => input.focus(), 60);   // シートが開いてからフォーカスする
}

function bindBucketEvents() {
  const page = document.getElementById('page-bucket');
  const nowStart = tbRanges().find(r => tbAge() >= r.start && tbAge() <= r.end)?.start ?? null;

  // 右下の追加ボタン：現在の年代を初期選択にして追加画面を開く
  page.querySelector('#tb-fab').onclick = () => tbOpenAddModal(nowStart);

  // 見出しの「＋」：その年代を初期選択にして追加画面を開く
  page.querySelectorAll('.tb-add-here').forEach(btn => {
    btn.onclick = () => tbOpenAddModal(+btn.dataset.age);
  });

  // 状態アイコン：進行中 → 達成 → 中止 → 進行中
  page.querySelectorAll('.tb-status').forEach(btn => {
    btn.onclick = () => {
      const it = (S.buckets || []).find(x => x.id === btn.dataset.id);
      if (!it) return;
      const order = ['active', 'done', 'stopped'];
      const cur = order.indexOf(TB_STATUS[it.status] ? it.status : 'active');
      it.status = order[(cur + 1) % order.length];
      // 達成にした時は今の年齢を初期値として入れる（編集画面で変更できる）
      if (it.status === 'done') { if (!Number.isFinite(it.doneAge)) it.doneAge = tbAge(); }
      else it.doneAge = null;
      save(); renderBucket();
    };
  });

  page.querySelectorAll('.tb-item-edit').forEach(btn => {
    btn.onclick = () => {
      const form = document.getElementById('tb-edit-' + btn.dataset.id);
      const wasOpen = form.classList.contains('open');
      page.querySelectorAll('.tb-edit-form').forEach(f => f.classList.remove('open'));
      if (!wasOpen) {
        form.classList.add('open');
        form.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
      }
    };
  });

  // 「達成」を選んだ時だけ達成年齢の欄を出す
  page.querySelectorAll('[id^="tb-e-st-"]').forEach(sel => {
    sel.onchange = () => {
      const wrap = document.getElementById('tb-e-donewrap-' + sel.id.replace('tb-e-st-', ''));
      if (wrap) wrap.style.display = sel.value === 'done' ? '' : 'none';
    };
  });

  page.querySelectorAll('.tb-cancel-btn').forEach(btn => {
    btn.onclick = () => document.getElementById('tb-edit-' + btn.dataset.id).classList.remove('open');
  });

  page.querySelectorAll('.tb-save-btn').forEach(btn => {
    btn.onclick = () => {
      const id = btn.dataset.id;
      const it = (S.buckets || []).find(x => x.id === id);
      if (!it) return;
      const text = document.getElementById('tb-e-text-' + id).value.trim();
      if (!text) { alert('やりたいことを入力してください'); return; }
      const ageVal  = document.getElementById('tb-e-age-' + id).value;
      const st      = document.getElementById('tb-e-st-' + id).value;
      const doneVal = document.getElementById('tb-e-done-' + id).value;
      it.text = text;
      it.age = ageVal === '' ? null : +ageVal;
      it.status = TB_STATUS[st] ? st : 'active';
      it.doneAge = it.status === 'done' ? (doneVal === '' ? tbAge() : Math.floor(+doneVal)) : null;
      save(); renderBucket();
    };
  });

  page.querySelectorAll('.tb-del-btn').forEach(btn => {
    btn.onclick = () => {
      const it = (S.buckets || []).find(x => x.id === btn.dataset.id);
      if (!it) return;
      if (!confirm(`「${it.text}」を削除しますか？`)) return;
      S.buckets = S.buckets.filter(x => x.id !== btn.dataset.id);
      save(); renderBucket();
    };
  });
}

// ── Time bucket: ドラッグで年代を移動 ───────────────────────────────────────
// スマホのタッチとPCのマウスを同じ Pointer Events で扱う。
// 縦スクロールと区別するため「長押ししてから動かす」方式にしている。
let tbPress = null;   // 長押し待ち { id, srcEl, x, y, timer }
let tbDrag  = null;   // ドラッグ中 { id, srcEl, clone, dx, dy, target, x, y }
let tbScrollDir = 0, tbScrollRaf = null, tbSuppressClick = false;

function tbCancelPress() {
  if (tbPress?.timer) clearTimeout(tbPress.timer);
  tbPress = null;
}

function tbStartDrag() {
  if (!tbPress) return;
  const { srcEl, id, x, y } = tbPress;
  if (!srcEl.isConnected) { tbCancelPress(); return; }
  const rect = srcEl.getBoundingClientRect();
  const clone = srcEl.cloneNode(true);
  clone.classList.add('tb-drag-clone');
  clone.style.width = rect.width + 'px';
  document.body.appendChild(clone);
  srcEl.classList.add('tb-drag-src');
  document.body.classList.add('tb-dragging');
  tbDrag = { id, srcEl, clone, dx: x - rect.left, dy: y - rect.top, target: null, x, y };
  navigator.vibrate?.(15);
  tbMoveDrag(x, y);
}

function tbUpdateTarget(x, y) {
  const under = document.elementFromPoint(x, y);
  const bucket = under && under.closest('.tb-bucket[data-drop-age]');
  if (bucket === tbDrag.target) return;
  tbDrag.target?.classList.remove('tb-drop');
  tbDrag.target = bucket;
  bucket?.classList.add('tb-drop');
}

function tbMoveDrag(x, y) {
  tbDrag.x = x; tbDrag.y = y;
  tbDrag.clone.style.left = (x - tbDrag.dx) + 'px';
  tbDrag.clone.style.top  = (y - tbDrag.dy) + 'px';
  tbUpdateTarget(x, y);
  // 画面の上下端に近づいたら自動スクロールする（年代が画面外にあるため）
  const zone = 80;
  tbScrollDir = y < zone ? -1 : y > window.innerHeight - zone ? 1 : 0;
  if (tbScrollDir && !tbScrollRaf) tbScrollRaf = requestAnimationFrame(tbScrollStep);
}

function tbScrollStep() {
  tbScrollRaf = null;
  if (!tbDrag || !tbScrollDir) return;
  const page = document.getElementById('page-bucket');
  const el = page.scrollHeight > page.clientHeight + 1
    ? page : (document.scrollingElement || document.documentElement);
  el.scrollTop += tbScrollDir * 10;
  tbUpdateTarget(tbDrag.x, tbDrag.y);   // スクロールで指の下の年代が変わる
  tbScrollRaf = requestAnimationFrame(tbScrollStep);
}

function tbEndDrag(apply) {
  const d = tbDrag;
  tbDrag = null;
  tbCancelPress();
  tbScrollDir = 0;
  if (tbScrollRaf) { cancelAnimationFrame(tbScrollRaf); tbScrollRaf = null; }
  d.clone.remove();
  d.srcEl.classList.remove('tb-drag-src');
  document.body.classList.remove('tb-dragging');
  const target = d.target;
  target?.classList.remove('tb-drop');
  tbSuppressClick = true;   // ドラッグ直後のクリックで編集が開かないようにする
  setTimeout(() => { tbSuppressClick = false; }, 350);
  if (!apply || !target) return;
  const it = (S.buckets || []).find(x => x.id === d.id);
  if (!it) return;
  const raw = target.dataset.dropAge;
  const newAge = raw === '' ? null : +raw;
  if (it.age === newAge) return;   // 同じ年代に落としたときは何もしない
  it.age = newAge;
  save();
  renderBucket();
}

// リスナーは一度だけ登録する（#page-bucket 自体は再描画で入れ替わらない）
function setupBucketDrag() {
  const page = document.getElementById('page-bucket');

  page.addEventListener('pointerdown', e => {
    if (e.button) return;                                        // 左ボタン/タッチのみ
    if (e.target.closest('.tb-status, .tb-item-edit')) return;    // ボタンは対象外
    const item = e.target.closest('.tb-item');
    if (!item) return;
    const id = item.querySelector('.tb-status')?.dataset.id;
    if (!id) return;
    tbCancelPress();
    tbPress = { id, srcEl: item, x: e.clientX, y: e.clientY, timer: setTimeout(tbStartDrag, 350) };
  });

  window.addEventListener('pointermove', e => {
    if (tbDrag) { tbMoveDrag(e.clientX, e.clientY); return; }
    // 長押し判定中に大きく動いたらスクロール操作とみなして中止する
    if (tbPress && Math.hypot(e.clientX - tbPress.x, e.clientY - tbPress.y) > 10) tbCancelPress();
  });

  window.addEventListener('pointerup',     () => { if (tbDrag) tbEndDrag(true);  else tbCancelPress(); });
  window.addEventListener('pointercancel', () => { if (tbDrag) tbEndDrag(false); else tbCancelPress(); });

  // ドラッグ中はブラウザのスクロールを止める（自前で端スクロールするため）
  document.addEventListener('touchmove', e => { if (tbDrag) e.preventDefault(); }, { passive: false });

  window.addEventListener('click', e => {
    if (!tbSuppressClick) return;
    tbSuppressClick = false;
    e.stopPropagation();
    e.preventDefault();
  }, true);
}

// 設定画面の入力値を検証する。問題なければ空文字を返す
function tbCfgError(birth, start, step, end) {
  const thisYear = TODAY.getFullYear();
  if (!Number.isFinite(birth) || birth < 1900 || birth > thisYear) return `生まれ年は1900〜${thisYear}で入力してください`;
  if (!Number.isFinite(start) || start < 0 || start > 120) return '開始年齢は0〜120で入力してください';
  if (!Number.isFinite(step) || step < 1 || step > 30) return '刻みは1〜30で入力してください';
  if (!Number.isFinite(end) || end > 120) return '終了年齢は120以下で入力してください';
  if (end < start) return '終了年齢は開始年齢以上にしてください';
  if (Math.floor((end - start) / step) + 1 > 40) return '区分が多すぎます。刻みを大きくしてください';
  return '';
}

function tbCfgInputs() {
  const v = id => Math.floor(+document.getElementById(id).value);
  return { birth: v('tb-cfg-birth'), start: v('tb-cfg-start'), step: v('tb-cfg-step'), end: v('tb-cfg-end') };
}

function tbCfgPreview() {
  const el = document.getElementById('tb-cfg-preview');
  if (!el) return;
  const { birth, start, step, end } = tbCfgInputs();
  const err = tbCfgError(birth, start, step, end);
  if (err) { el.innerHTML = `<span style="color:var(--stop)">${err}</span>`; return; }
  const ranges = tbMakeRanges(start, step, end);
  el.textContent = `${ranges.map(tbLabel).join(' / ')}（${ranges.length}区分・いま${TODAY.getFullYear() - birth}歳）`;
}

  const colorOpts = Object.keys(COLORS).map(name => {
    return `<div class="color-dot${S.newColor===name?' sel':''}" data-color="${name}" style="background:${COLORS[name].primary}"></div>`;
  }).join('');

  const userInfo = currentUser
    ? `<div style="display:flex;align-items:center;gap:10px;padding:10px 0 16px;border-bottom:1px solid var(--border);margin-bottom:4px">
        ${currentUser.photoURL ? `<img style="width:36px;height:36px;border-radius:50%;object-fit:cover" src="${currentUser.photoURL}">` : `<div style="width:36px;height:36px;border-radius:50%;background:var(--accent-light);display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--accent)">${(currentUser.displayName||'U')[0]}</div>`}
        <div style="flex:1"><div style="font-size:13px;font-weight:600">${currentUser.displayName||''}</div><div style="font-size:11px;color:var(--text-sub)">${currentUser.email||''}</div></div>
      </div>` : '';

  modal.innerHTML = `
    <div class="modal-bar"></div>
    <div class="modal-h">設定</div>
    ${userInfo}
    <div>${goalRows}</div>
    <div class="add-section">
      <div class="add-h">目標を追加</div>
      <span class="field-lbl">目標名</span>
      <input class="text-input" id="new-name" type="text" placeholder="例：瞑想">
      <span class="field-lbl">アイコン</span>
      <div class="icon-grid" id="icon-grid">${iconOpts}</div>
      <span class="field-lbl">カラー</span>
      <div class="color-row">${colorOpts}</div>
      <span class="field-lbl">頻度</span>
      <select class="freq-sel" id="new-freq">
        <option value="daily">毎日</option>
        <option value="weekdays">平日のみ</option>
        <option value="weekends">土日のみ</option>
        <option value="monthly">月1回</option>
      </select>
      <button class="add-goal-btn" id="add-goal">追加する</button>
    </div>
    <div class="add-section">
      <div class="add-h">タイムバケットの設定</div>
      <span class="field-lbl">生まれ年（西暦）</span>
      <input class="text-input" id="tb-cfg-birth" type="number" value="${tbCfg().birthYear}">
      <div class="form-grid">
        <div class="form-group"><label class="form-label">開始年齢</label><input class="form-input" id="tb-cfg-start" type="number" value="${tbCfg().startAge}"></div>
        <div class="form-group"><label class="form-label">刻み（年）</label><input class="form-input" id="tb-cfg-step" type="number" value="${tbCfg().step}"></div>
        <div class="form-group"><label class="form-label">終了年齢</label><input class="form-input" id="tb-cfg-end" type="number" value="${tbCfg().endAge}"></div>
      </div>
      <div class="tb-cfg-preview" id="tb-cfg-preview"></div>
      <button class="add-goal-btn" id="tb-cfg-save">設定を保存</button>
    </div>
    <div class="logout-row">
      <button class="logout-btn" id="logout-btn">ログアウト</button>
    </div>`;

  modal.querySelectorAll('.goal-del').forEach(btn => {
    btn.onclick = () => {
      if (!confirm('この目標を削除しますか？')) return;
      S.goals = S.goals.filter(g => g.id !== btn.dataset.id);
      save(); renderSettings();
      if (S.tab === 'calendar') renderCalendar();
    };
  });

  // Edit button: toggle edit form
  modal.querySelectorAll('.goal-edit').forEach(btn => {
    btn.onclick = () => {
      const id = btn.dataset.id;
      const form = document.getElementById('edit-form-' + id);
      const isOpen = form.style.display !== 'none';
      // Close all other edit forms
      modal.querySelectorAll('.goal-edit-form').forEach(f => f.style.display = 'none');
      if (!isOpen) form.style.display = '';
    };
  });

  // Edit form: icon selection (only within each form)
  modal.querySelectorAll('.goal-edit-form .icon-opt').forEach(opt => {
    opt.onclick = () => {
      const gid = opt.dataset.gid;
      const grid = document.getElementById('edit-icon-grid-' + gid);
      grid.querySelectorAll('.icon-opt').forEach(o => {
        const s = o.dataset.icon === opt.dataset.icon;
        o.classList.toggle('sel', s);
        o.innerHTML = ico(o.dataset.icon, 20, s ? 'var(--accent)' : 'var(--text-sub)');
      });
    };
  });

  // Edit form: color selection (only within each form)
  modal.querySelectorAll('.goal-edit-form .color-dot').forEach(dot => {
    dot.onclick = () => {
      const gid = dot.dataset.gid;
      const row = document.getElementById('edit-color-row-' + gid);
      row.querySelectorAll('.color-dot').forEach(d => d.classList.toggle('sel', d.dataset.color === dot.dataset.color));
    };
  });

  // Edit form: cancel
  modal.querySelectorAll('.goal-cancel-btn').forEach(btn => {
    btn.onclick = () => {
      document.getElementById('edit-form-' + btn.dataset.id).style.display = 'none';
    };
  });

  // Edit form: save
  modal.querySelectorAll('.goal-save-btn').forEach(btn => {
    btn.onclick = () => {
      const id = btn.dataset.id;
      const name = document.getElementById('edit-name-' + id).value.trim();
      if (!name) { alert('目標名を入力してください'); return; }
      const selIcon = document.querySelector(`#edit-icon-grid-${id} .icon-opt.sel`);
      const selColor = document.querySelector(`#edit-color-row-${id} .color-dot.sel`);
      const freq = document.getElementById('edit-freq-' + id).value;
      const g = S.goals.find(g => g.id === id);
      if (g) {
        g.name = name;
        if (selIcon) g.icon = selIcon.dataset.icon;
        if (selColor) g.color = selColor.dataset.color;
        g.frequency = freq;
      }
      save(); renderSettings();
      if (S.tab === 'calendar') renderCalendar();
    };
  });

  modal.querySelectorAll('.icon-opt:not([data-gid])').forEach(opt => {
    opt.onclick = () => {
      S.newIcon = opt.dataset.icon;
      modal.querySelectorAll('.icon-grid:not([id^="edit-icon"]) .icon-opt').forEach(o => {
        const s = o.dataset.icon === S.newIcon;
        o.classList.toggle('sel', s);
        o.innerHTML = ico(o.dataset.icon, 20, s ? 'var(--accent)' : 'var(--text-sub)');
      });
    };
  });

  modal.querySelectorAll('.color-dot:not([data-gid])').forEach(dot => {
    dot.onclick = () => {
      S.newColor = dot.dataset.color;
      modal.querySelectorAll('.color-dot:not([data-gid])').forEach(d => d.classList.toggle('sel', d.dataset.color === S.newColor));
    };
  });

  modal.querySelector('#add-goal').onclick = () => {
    const name = modal.querySelector('#new-name').value.trim();
    if (!name) { alert('目標名を入力してください'); return; }
    const freq = modal.querySelector('#new-freq').value;
    S.goals.push({ id: 'g'+Date.now(), name, icon: S.newIcon, color: S.newColor, frequency: freq });
    save(); modal.querySelector('#new-name').value = '';
    renderSettings();
    if (S.tab === 'calendar') renderCalendar();
  };

  // タイムバケットの設定：入力するたびに区分のプレビューを更新する
  ['tb-cfg-birth', 'tb-cfg-start', 'tb-cfg-step', 'tb-cfg-end'].forEach(id => {
    modal.querySelector('#' + id).oninput = tbCfgPreview;
  });
  tbCfgPreview();

  modal.querySelector('#tb-cfg-save').onclick = () => {
    const { birth, start, step, end } = tbCfgInputs();
    const err = tbCfgError(birth, start, step, end);
    if (err) { alert(err); return; }
    S.bucketCfg = { birthYear: birth, startAge: start, step, endAge: end };
    save();
    const btn = modal.querySelector('#tb-cfg-save');
    btn.textContent = '保存しました';
    setTimeout(() => { if (btn.isConnected) btn.textContent = '設定を保存'; }, 1600);
    if (S.tab === 'bucket') renderBucket();
  };

  modal.querySelector('#logout-btn').onclick = () => { closeSettings(); logout(); };

}

// ── Init ──
document.querySelector('.tabs').addEventListener('click', e => {
  const btn = e.target.closest('[data-page]');
  if (btn) navigate(btn.dataset.page);
});
document.getElementById('settings-btn').onclick = openSettings;
document.getElementById('overlay').addEventListener('click', e => {
  if (e.target.id === 'overlay') closeSettings();
});
document.getElementById('login-btn').onclick = login;

// スワイプでのページ送り：カレンダー＝月移動、年間＝年移動
setupSwipeNav('page-calendar', {
  exclude: 'textarea, input, .memo-edit-inner, .text-block-edit',
  hScroll: '.table-wrap, .rings-row',
  onSwipe: changeMonth,
});
setupSwipeNav('page-annual', {
  exclude: 'textarea, input, .text-block-edit, .vb-lb',
  hScroll: '.annual-wrap',
  onSwipe: changeYear,
});

setupBucketDrag();

// 画面復帰時：「今日」の日付を更新し、他端末での変更を取り込んで再描画する
document.addEventListener('visibilitychange', async () => {
  if (document.visibilityState !== 'visible' || !currentUser || !dataLoaded) return;
  TODAY = new Date();
  // 編集中・入力中に再描画すると内容が消えるためスキップ
  const editing = document.querySelector('.text-block-edit.open, .memo-edit-row.open, .tb-edit-form.open')
    || document.getElementById('overlay').classList.contains('open');
  const bodyDirty = ['bw', 'bf', 'ba'].some(id => {
    const el = document.getElementById(id);
    return el && el.value;
  });
  if (editing || bodyDirty) return;
  await loadFromFirestore(); // 失敗しても手元の状態をそのまま使う
  navigate(S.tab);
});

// リダイレクトログイン後の結果を受け取る（ポップアップがブロックされた場合のフォールバック）
try {
  await getRedirectResult(auth);
} catch(e) {
  // auth/missing-initial-state はiOS SafariのITPによるもの。無視する
  if (e.code && e.code !== 'auth/missing-initial-state') {
    console.warn('Redirect auth error:', e.code);
  }
}

// アイコンライブラリの読み込みを開始する。await しないので、
// 通信が遅い・失敗する場合でもログインボタンや画面の操作はブロックされない。
loadIcons();

onAuthStateChanged(auth, async user => {
  currentUser = user;
  if (user) {
    // Show app, hide login
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('app').style.display = '';
    // Show user avatar in header
    const headerUser = document.getElementById('header-user');
    if (headerUser) {
      if (user.photoURL) {
        headerUser.innerHTML = `<img class="user-avatar" src="${user.photoURL}" alt="${user.displayName||''}" title="ログアウト">`;
      } else {
        const letter = (user.displayName||'U')[0].toUpperCase();
        headerUser.innerHTML = `<div class="user-avatar-placeholder" title="ログアウト">${letter}</div>`;
      }
      headerUser.querySelector('.user-avatar, .user-avatar-placeholder').addEventListener('click', logout);
    }
    // Load data and render
    const ok = await loadFromFirestore();
    if (!ok) {
      alert('データの読み込みに失敗しました。通信環境を確認してページを再読み込みしてください。\n（データ保護のため、読み込みできるまで保存は無効になります）');
    } else {
      migrateVisionBoards(); // 旧形式のビジョンボードがあれば移行（完了を待つ必要はない）
    }
    renderCalendar();
  } else {
    // Show login, hide app
    document.getElementById('login-screen').style.display = '';
    document.getElementById('app').style.display = 'none';
    const headerUser = document.getElementById('header-user');
    if (headerUser) headerUser.innerHTML = '';
  }
});
</script>
</body>
</html>
